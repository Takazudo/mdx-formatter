name: 'Build zfb Documentation Site'
description: 'Set up the workspace and build the zudo-doc site with zfb'

inputs:
  node-version:
    description: 'Node.js version to use'
    required: false
    default: '22'
  working-directory:
    description: 'Working directory containing the zfb documentation project'
    required: false
    default: 'doc'

runs:
  using: 'composite'
  steps:
    # pnpm version comes from the root package.json "packageManager" field.
    - name: Setup pnpm
      uses: pnpm/action-setup@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'pnpm'

    - name: Setup Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Install wasm-pack
      uses: taiki-e/install-action@v2
      with:
        tool: wasm-pack

    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      shell: bash

    - name: Build WASM for playground
      run: pnpm build:wasm:doc
      shell: bash

    - name: Build main package
      run: pnpm build
      shell: bash

    - name: Check zfb documentation site
      run: pnpm check
      shell: bash
      working-directory: ${{ inputs.working-directory }}

    - name: Build zfb documentation site
      run: pnpm build
      shell: bash
      working-directory: ${{ inputs.working-directory }}

    - name: Verify build output
      run: |
        if [ ! -d "dist" ]; then
          echo "❌ Error: dist/ directory not found"
          exit 1
        fi
        HTML_COUNT=$(find dist -name "*.html" | wc -l)
        echo "📄 HTML pages: $HTML_COUNT"
        echo "✅ Build output verified"
      shell: bash
      working-directory: ${{ inputs.working-directory }}
