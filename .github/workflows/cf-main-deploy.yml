name: Cloudflare Production Deploy

on:
  push:
    branches:
      - main

concurrency:
  group: cf-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build Documentation Site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Astro site
        uses: ./.github/actions/build-astro
        with:
          node-version: '22'
          pnpm-version: '10'
          working-directory: 'doc'

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: astro-build-cf-production
          path: doc/dist/
          include-hidden-files: true
          retention-days: 1

  deploy:
    name: Deploy to Cloudflare Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: astro-build-cf-production
          path: dist-raw

      - name: Restructure build for base path
        run: |
          mkdir -p deploy-dir/pj/mdx-formatter
          cp -r dist-raw/* deploy-dir/pj/mdx-formatter/
          if [ -f deploy-dir/pj/mdx-formatter/_redirects ]; then
            mv deploy-dir/pj/mdx-formatter/_redirects deploy-dir/_redirects
          fi

      - name: Install wrangler
        run: npm install -g wrangler@4

      - name: Deploy to Cloudflare Pages
        run: |
          wrangler pages deploy deploy-dir \
            --project-name=mdx-formatter \
            --branch=main \
            --commit-hash="${GITHUB_SHA}" \
            --commit-message="Production deploy: ${GITHUB_SHA}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
