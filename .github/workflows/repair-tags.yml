# Manual recovery only: moves `latest` back to a stable version on all five
# packages. Never publishes, never touches `next`, never creates a release.
#
# plan   read-only: refuses while any Release run is active (old revisions did
#        not share the concurrency group), validates all five and prints the plan.
# apply  only when dry_run is false. The only job with id-token: write; npm
#        authenticates through OIDC (no token). It re-checks for active Release
#        runs and re-reads every package right before each write.
#
# npm trusted publisher for each package: owner Takazudo, repository
# mdx-formatter, workflow repair-tags.yml, environment empty, allowed action
# npm dist-tag only (no npm publish).
name: Repair npm latest tags
run-name: ${{ format('Repair latest to {0}{1}', inputs.stable_version, inputs.dry_run && ' (dry run)' || '') }}

on:
  workflow_dispatch:
    inputs:
      stable_version:
        description: 'Newest stable version present on all five packages (for example 1.2.1)'
        required: true
        type: string
      dry_run:
        description: 'Print the verified command plan without writes'
        required: true
        default: true
        type: boolean

concurrency:
  group: npm-release-and-tag-repair
  cancel-in-progress: false
  queue: max

permissions: {}

env:
  NODE_RELEASE_VERSION: '24.22.0'
  NPM_RELEASE_VERSION: '11.21.1'

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_RELEASE_VERSION }}
      - name: Refuse to overlap any active Release run
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release/no-active-release.sh
      - name: Validate all five packages and print the plan (no writes)
        env:
          STABLE_VERSION: ${{ inputs.stable_version }}
        run: node scripts/release/tags-cli.mjs repair "$STABLE_VERSION" --dry-run

  apply:
    needs: plan
    if: inputs.dry_run == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # No registry-url: setup-node would write an npmrc expecting NODE_AUTH_TOKEN.
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_RELEASE_VERSION }}
      - name: Pin npm for OIDC dist-tag
        run: |
          npm install -g "npm@${NPM_RELEASE_VERSION}"
          test "$(npm --version)" = "$NPM_RELEASE_VERSION"
      - name: Refuse to overlap any active Release run
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release/no-active-release.sh
      - name: Repair latest (next unchanged)
        env:
          STABLE_VERSION: ${{ inputs.stable_version }}
        run: node scripts/release/tags-cli.mjs repair "$STABLE_VERSION"
