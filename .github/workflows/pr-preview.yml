name: PR Preview Deploy

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    name: Build Documentation Site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Astro site
        uses: ./.github/actions/build-astro
        with:
          node-version: '22'
          pnpm-version: '10'
          working-directory: 'doc'

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: astro-build-preview
          path: doc/dist/
          include-hidden-files: true
          retention-days: 1

  deploy:
    name: Deploy Preview
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: astro-build-preview
          path: dist-raw

      - name: Restructure build for base path
        run: |
          mkdir -p deploy-dir/pj/mdx-formatter
          cp -r dist-raw/* deploy-dir/pj/mdx-formatter/
          # _redirects is already in the build output via public/_redirects
          # but it ends up inside the base path — move it to root
          if [ -f deploy-dir/pj/mdx-formatter/_redirects ]; then
            mv deploy-dir/pj/mdx-formatter/_redirects deploy-dir/_redirects
          fi

      - name: Install wrangler
        run: npm install -g wrangler@4

      - name: Deploy to Cloudflare Pages
        id: deploy
        run: |
          DEPLOY_OUTPUT=$(wrangler pages deploy deploy-dir \
            --project-name=mdx-formatter \
            --branch="pr-${{ github.event.pull_request.number }}" \
            --commit-hash="${GITHUB_SHA}" \
            --commit-message="PR #${{ github.event.pull_request.number }} preview" 2>&1)
          echo "$DEPLOY_OUTPUT"
          DEPLOY_URL="https://pr-${{ github.event.pull_request.number }}.mdx-formatter.pages.dev"
          echo "deploy-url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.deploy-url }}
        with:
          script: |
            const deployUrl = process.env.DEPLOY_URL;
            const marker = '<!-- cf-preview-pr -->';
            const body = [
              marker,
              `### Preview Deployment`,
              ``,
              `| | |`,
              `|---|---|`,
              `| **Preview URL** | ${deployUrl}/pj/mdx-formatter/ |`,
              `| **Commit** | \`${context.sha.slice(0, 7)}\` |`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
