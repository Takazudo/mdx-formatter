# release.yml — publishes all five npm packages through trusted publishing (OIDC).
#
# Triggers
#   push of a v* tag (a person with tag rights), or
#   workflow_dispatch at a v* tag (release-coordinator.yml, or "Run workflow"
#   in the Actions UI). A tag created with GITHUB_TOKEN does not start push
#   workflows, so the coordinator dispatches this file explicitly.
#   workflow_dispatch with dry_run=true on any ref builds, packs and verifies
#   the five tarballs and never publishes (artifact-only native verification).
#
# Jobs
#   gate      read-only. Real runs: ref is refs/tags/vX.Y.Z of this file, the
#             tag names GITHUB_SHA, package.json/npm/*/lockfile/changelog are
#             lockstep at X.Y.Z, the commit is on main, ci.yml's push run on main
#             is green for exactly that commit, npm is readable (unknown ->
#             stop) and no dist-tag would regress.
#   build     four native binaries (one per OS/arch runner).
#   pack      prepublishOnly equivalent (tsc + vitest against the Linux binary
#             that ships), then packs once: natives with npm, root with pnpm
#             (workspace:X.Y.Z -> X.Y.Z). Verifies every tarball, installs the
#             packed root + Linux package and runs the library and CLI, and
#             uploads the tarballs with their sha512 integrities.
#   publish   the only job with id-token: write. npm 11.21.1, no token: refuses
#             NPM_TOKEN / NODE_AUTH_TOKEN / npmrc tokens. Publishes the exact
#             packed files, natives first and visible before the root; an
#             existing version must have identical bytes. Then moves latest and
#             next on all five.
#   finalize  contents: write. Reads back all five (integrity, provenance for
#             this tag + commit + workflow, trusted publisher, both dist-tags),
#             then creates or confirms the GitHub Release from the changelog.
#
# npm trusted publisher for each of the five packages (npmjs.com, Settings):
#   owner Takazudo, repository mdx-formatter, workflow release.yml,
#   environment empty, allowed: npm publish + npm dist-tag.
# Keep this filename and the job free of environments; both are part of that identity.
#
# Resume a failed run with "Re-run failed jobs" on the same run (or the
# coordinator, which does that for a partial publish): it reuses this run's
# packed tarballs. A fresh run rebuilds natives, and the publish step stops if
# npm already holds different bytes for the version.

name: Release
run-name: ${{ inputs.dry_run && format('Release {0} (dry run)', github.ref_name) || format('Release {0}', github.ref_name) }}

# Shared with repair-tags.yml so tag writes never interleave.
concurrency:
  group: npm-release-and-tag-repair
  cancel-in-progress: false
  queue: max

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build, pack and verify only; no npm writes, no GitHub Release'
        type: boolean
        default: false

permissions: {}

env:
  NODE_RELEASE_VERSION: '24.22.0'
  NPM_RELEASE_VERSION: '11.21.1'

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      mode: ${{ steps.gate.outputs.mode }}
      version: ${{ steps.gate.outputs.version }}
      sha: ${{ steps.gate.outputs.sha }}
      build: ${{ steps.gate.outputs.build }}
      publish: ${{ steps.gate.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_RELEASE_VERSION }}
      - name: Gate release identity
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run == true }}
        run: node scripts/release/tags-cli.mjs release-gate --dry-run "$DRY_RUN"

  build:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest
            target: aarch64-apple-darwin
            build: |
              cargo build -p mdx-formatter-napi --release --target aarch64-apple-darwin
              mv target/aarch64-apple-darwin/release/libmdx_formatter_napi.dylib mdx-formatter-napi.darwin-arm64.node
          - host: macos-latest
            target: x86_64-apple-darwin
            build: |
              cargo build -p mdx-formatter-napi --release --target x86_64-apple-darwin
              mv target/x86_64-apple-darwin/release/libmdx_formatter_napi.dylib mdx-formatter-napi.darwin-x64.node
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            build: |
              cargo build -p mdx-formatter-napi --release --target x86_64-unknown-linux-gnu
              mv target/x86_64-unknown-linux-gnu/release/libmdx_formatter_napi.so mdx-formatter-napi.linux-x64-gnu.node
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            build: |
              cargo build -p mdx-formatter-napi --release --target x86_64-pc-windows-msvc
              mv target/x86_64-pc-windows-msvc/release/mdx_formatter_napi.dll mdx-formatter-napi.win32-x64-msvc.node
    runs-on: ${{ matrix.settings.host }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}
      - name: Build
        shell: bash
        run: ${{ matrix.settings.build }}
      - uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.settings.target }}
          path: mdx-formatter-napi.*.node
          if-no-files-found: error

  pack:
    needs: [gate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify the five packages are in lockstep (no rewrite)
        run: node scripts/sync-napi-versions.mjs --check
      # pnpm comes from package.json "packageManager"; its pack rewrites workspace:X.Y.Z.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_RELEASE_VERSION }}
      - name: Pin npm
        run: |
          npm install -g "npm@${NPM_RELEASE_VERSION}"
          test "$(npm --version)" = "$NPM_RELEASE_VERSION"
      - uses: actions/download-artifact@v4
        with:
          pattern: bindings-*
          path: ${{ runner.temp }}/bindings
      - run: pnpm install --frozen-lockfile
      - name: Place the shipped Linux binary for the prepublish tests
        # src/rust-formatter.ts prefers crates/mdx-formatter-napi/mdx-formatter-napi.node,
        # so the tests below exercise the exact binary in the linux-x64-gnu tarball.
        run: cp "$RUNNER_TEMP/bindings/bindings-x86_64-unknown-linux-gnu/mdx-formatter-napi.linux-x64-gnu.node" crates/mdx-formatter-napi/mdx-formatter-napi.node
      - name: prepublishOnly equivalent (tsc and vitest)
        run: |
          pnpm exec tsc
          pnpm exec vitest run
      - name: Pack once, verify and smoke-test the packed install
        env:
          VERSION: ${{ needs.gate.outputs.version }}
          SHA: ${{ needs.gate.outputs.sha }}
        run: node scripts/release/tags-cli.mjs pack --version "$VERSION" --sha "$SHA" --out "$RUNNER_TEMP/tarballs" --bindings "$RUNNER_TEMP/bindings"
      - uses: actions/upload-artifact@v4
        with:
          name: release-tarballs
          path: ${{ runner.temp }}/tarballs
          if-no-files-found: error
          retention-days: 90

  publish:
    needs: [gate, pack]
    if: >-
      always() && needs.gate.result == 'success' &&
      needs.gate.outputs.mode == 'release' && needs.gate.outputs.publish == 'true' &&
      startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true &&
      (needs.pack.result == 'success' || (needs.pack.result == 'skipped' && needs.gate.outputs.build != 'true'))
    runs-on: ubuntu-latest
    # Bounded registry propagation waits (up to ~6 min per package) fit inside this.
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    outputs:
      published_here: ${{ steps.publish.outputs.published_here }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # No registry-url: setup-node would write an npmrc expecting NODE_AUTH_TOKEN.
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_RELEASE_VERSION }}
      - name: Pin npm for OIDC publish and dist-tag
        run: |
          npm install -g "npm@${NPM_RELEASE_VERSION}"
          test "$(npm --version)" = "$NPM_RELEASE_VERSION"
          node --version
      - uses: actions/download-artifact@v4
        if: needs.pack.result == 'success'
        with:
          name: release-tarballs
          path: ${{ runner.temp }}/tarballs
      - name: Publish through OIDC, then move latest and next
        id: publish
        env:
          VERSION: ${{ needs.gate.outputs.version }}
          SHA: ${{ needs.gate.outputs.sha }}
        run: node scripts/release/tags-cli.mjs publish --version "$VERSION" --sha "$SHA" --dir "$RUNNER_TEMP/tarballs"

  finalize:
    needs: [gate, pack, publish]
    if: >-
      always() && needs.gate.result == 'success' && needs.gate.outputs.mode == 'release' &&
      (needs.pack.result == 'success' || (needs.pack.result == 'skipped' && needs.gate.outputs.build != 'true')) &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_RELEASE_VERSION }}
      - uses: actions/download-artifact@v4
        if: needs.pack.result == 'success'
        with:
          name: release-tarballs
          path: ${{ runner.temp }}/tarballs
      - name: Read back all five packages
        env:
          VERSION: ${{ needs.gate.outputs.version }}
          SHA: ${{ needs.gate.outputs.sha }}
          PUBLISHED_HERE: ${{ needs.publish.outputs.published_here }}
        run: node scripts/release/tags-cli.mjs verify --version "$VERSION" --sha "$SHA" --dir "$RUNNER_TEMP/tarballs" --published-here "$PUBLISHED_HERE"
      - name: Create or confirm the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.gate.outputs.version }}
          SHA: ${{ needs.gate.outputs.sha }}
        run: node scripts/release/tags-cli.mjs finalize --version "$VERSION" --sha "$SHA"
